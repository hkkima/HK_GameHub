<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응속도 테스트</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background: #1b1f2a; color: #fff;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    user-select: none; cursor: pointer;
    transition: background .12s;
  }
  body.wait { background: #b3402f; }
  body.go   { background: #1f9d55; }
  body.early { background: #6b4fbb; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: clamp(28px, 7vw, 52px); margin: 0 0 12px; letter-spacing: -.02em; }
  p  { font-size: clamp(14px, 3vw, 18px); margin: 0; opacity: .85; line-height: 1.6; }
  .best { margin-top: 22px; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<main>
  <h1 id="headline">반응속도 테스트</h1>
  <p id="sub">화면을 클릭해서 시작하세요</p>
  <p class="best" id="best"></p>
</main>

<script>
  const body = document.body;
  const headline = document.getElementById('headline');
  const sub = document.getElementById('sub');
  const bestLine = document.getElementById('best');

  let phase = 'idle';   // idle | wait | go | done
  let timer = null;
  let goAt = 0;

  // localStorage 는 게임 오리진(hk-games.pages.dev)에 저장된다.
  // 허브 오리진과 분리되어 있어 인증 정보에는 접근할 수 없다.
  const KEY = 'demo-reaction-best';
  let best = Number(localStorage.getItem(KEY)) || 0;

  function paintBest() {
    bestLine.textContent = best ? `최고 기록 ${best}ms` : '';
  }

  function start() {
    phase = 'wait';
    body.className = 'wait';
    headline.textContent = '기다리세요';
    sub.textContent = '초록색으로 바뀌면 클릭';
    timer = setTimeout(() => {
      phase = 'go';
      body.className = 'go';
      headline.textContent = '지금!';
      sub.textContent = '';
      goAt = performance.now();
    }, 1200 + Math.random() * 2800);
  }

  function tooEarly() {
    clearTimeout(timer);
    phase = 'done';
    body.className = 'early';
    headline.textContent = '너무 빨랐습니다';
    sub.textContent = '다시 하려면 클릭하세요';
  }

  function record() {
    const ms = Math.round(performance.now() - goAt);
    phase = 'done';
    body.className = '';
    headline.textContent = `${ms}ms`;

    if (!best || ms < best) {
      best = ms;
      localStorage.setItem(KEY, String(best));
      sub.textContent = '신기록입니다. 다시 하려면 클릭하세요';
    } else {
      sub.textContent = '다시 하려면 클릭하세요';
    }
    paintBest();
  }

  function tap() {
    if (phase === 'idle' || phase === 'done') { start(); return; }
    if (phase === 'wait') { tooEarly(); return; }
    if (phase === 'go') record();
  }

  addEventListener('pointerdown', tap);
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); }
  });

  paintBest();
</script>
</body>
</html>
