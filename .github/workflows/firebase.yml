name: Firebase 배포

# 수동 실행 전용이다.
#
# 이 Firebase 프로젝트는 베팅·주식·홀덤 등 여러 앱이 공유한다. 푸시할 때마다
# 자동 배포되면 그쪽 규칙과 함수를 덮어쓸 위험이 있어 자동화하지 않는다.
#
# 함수는 firebase.json 에서 codebase "gamehub" 로 분리해 두었고, 배포도
# `--only functions:gamehub` 로 그 codebase 만 대상으로 한다. 다른 앱의 함수는
# 이 워크플로가 건드리지 않는다. 절대 codebase 필터 없이 배포하지 말 것.
on:
  workflow_dispatch:
    inputs:
      action:
        description: '무엇을 할지'
        required: true
        default: dump
        type: choice
        options:
          - dump              # 현재 배포된 규칙을 읽어서 출력만 한다 (안전)
          - deploy-rules      # firestore.rules 배포
          - deploy-functions  # gamehub codebase 함수만 배포
          - deploy-all        # 규칙 + 함수

permissions:
  contents: read

env:
  PROJECT_ID: hk-chess-betting

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 서비스 계정 키를 파일로 떨어뜨리고 표준 위치를 가리킨다.
      # google-github-actions/auth 를 쓰지 않는 이유는 그 액션의 access_token 모드가
      # IAM generateAccessToken 을 거쳐서, 서비스 계정이 자기 자신을 가장할 수 있어야
      # 하기 때문이다. 그러려면 Token Creator 역할을 추가로 줘야 한다.
      # 키로 직접 JWT 를 서명하는 표준 흐름은 추가 권한이 필요 없다.
      - name: 자격증명 준비
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 비어 있습니다."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          node -e "
            const sa = require(process.env.RUNNER_TEMP + '/sa.json');
            for (const k of ['client_email','private_key','token_uri','project_id']) {
              if (!sa[k]) { console.error('키 JSON 에 ' + k + ' 가 없습니다.'); process.exit(1); }
            }
            console.log('서비스 계정: ' + sa.client_email);
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # 현재 배포된 규칙을 그대로 읽는다. 병합본을 만들려면 지금 무엇이 올라가
      # 있는지 먼저 알아야 한다. 출력은 base64 다 (아래 주석 참고).
      - name: 현재 규칙 덤프
        if: inputs.action == 'dump'
        run: |
          # GitHub 이 여러 줄 시크릿의 중괄호까지 마스킹해서, 규칙 원문을 그대로
          # 찍으면 { } 가 전부 *** 로 가려진다. 그래서 base64 로 내보낸다.
          node scripts/rules-dump.mjs

      - name: 규칙 배포
        if: inputs.action == 'deploy-rules' || inputs.action == 'deploy-all'
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      # ★ --only functions:gamehub — codebase 를 반드시 지정한다 ★
      #   필터 없이 `--only functions` 로 배포하면 이 레포에 없는 다른 앱의 함수를
      #   삭제 대상으로 잡는다.
      - name: 함수 배포 (gamehub codebase 만)
        if: inputs.action == 'deploy-functions' || inputs.action == 'deploy-all'
        run: |
          npx --yes firebase-tools@13 deploy \
            --only functions:gamehub \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force

      - name: 자격증명 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
