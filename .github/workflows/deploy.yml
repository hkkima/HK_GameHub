name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # 앱 폴더가 처음 커밋된 날짜로 "최신순" 을 정하기 때문에 전체 히스토리가 필요하다
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 빌드
        run: node scripts/build.mjs
        env:
          HUB_ORIGIN: https://hk-gamehub.pages.dev

      - name: 게임 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/games --project-name=hk-games --branch=main --commit-dirty=true

      - name: 허브 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/hub --project-name=hk-gamehub --branch=main --commit-dirty=true

      - name: 요약
        run: |
          echo "### 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 허브: https://hk-gamehub.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 게임: https://hk-games.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 등록된 게임: $(node -e "console.log(require('./dist/hub/games.json').length)")개" >> $GITHUB_STEP_SUMMARY
