name: Firestore 규칙

# 수동 실행 전용이다.
#
# 이 Firestore 는 다른 앱과 공유하므로, 푸시할 때마다 규칙이 자동 배포되면
# 그 앱의 규칙을 덮어쓰게 된다. 규칙은 한 번 넣으면 끝나는 일이라 자동화하지 않는다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: '무엇을 할지'
        required: true
        default: dump
        type: choice
        options:
          - dump    # 현재 배포된 규칙을 읽어서 출력만 한다 (안전)
          - deploy  # firestore.rules 를 배포한다 (기존 규칙을 대체하므로 주의)

permissions:
  contents: read

env:
  PROJECT_ID: hk-chess-betting

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 서비스 계정 키를 파일로 떨어뜨리고 표준 위치를 가리킨다.
      # google-github-actions/auth 를 쓰지 않는 이유는 그 액션의 access_token 모드가
      # IAM generateAccessToken 을 거쳐서, 서비스 계정이 자기 자신을 가장할 수 있어야
      # 하기 때문이다. 그러려면 Token Creator 역할을 추가로 줘야 한다.
      # 키로 직접 JWT 를 서명하는 표준 흐름은 추가 권한이 필요 없다.
      - name: 자격증명 준비
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 비어 있습니다."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          node -e "
            const sa = require(process.env.RUNNER_TEMP + '/sa.json');
            for (const k of ['client_email','private_key','token_uri','project_id']) {
              if (!sa[k]) { console.error('키 JSON 에 ' + k + ' 가 없습니다.'); process.exit(1); }
            }
            console.log('서비스 계정: ' + sa.client_email);
            console.log('프로젝트   : ' + sa.project_id);
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # 현재 배포된 규칙을 그대로 읽어 로그와 요약에 남긴다.
      # 병합본을 만들려면 지금 무엇이 올라가 있는지 먼저 알아야 한다.
      - name: 현재 규칙 덤프
        if: inputs.action == 'dump'
        run: |
          node scripts/rules-dump.mjs | tee /tmp/current.rules
          {
            echo '### 현재 배포된 Firestore 규칙'
            echo ''
            echo '```'
            cat /tmp/current.rules
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 규칙 배포
        if: inputs.action == 'deploy'
        run: |
          echo '배포할 firestore.rules:'
          cat firestore.rules
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: 자격증명 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
